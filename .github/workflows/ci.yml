name: CI

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['pubspec.yaml', 'bin/**', 'lib/**', 'test/**', 'tool/**', 'native/**']
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to test, or leave empty to test the selected branch.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  start:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/ci'))
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-check-start.yml@latest
    with:
      check-name: CI
      command: /ci
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}

  test:
    name: Test on Gizlet ARM64
    needs: start
    if: >-
      !cancelled() && (
        needs.start.outputs.run == 'true'
        || (needs.start.result == 'skipped' && github.event_name != 'issue_comment'))
    runs-on: ${{ fromJSON(vars.RUNNERS)['linux-arm64'] }}
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ci-${{ needs.start.outputs.number || github.ref }}
      cancel-in-progress: ${{ needs.start.outputs.number != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.start.outputs.head_sha || github.sha }}
          persist-credentials: false
      - run: bash tool/ci.sh

  finish:
    needs: [start, test]
    if: always() && needs.start.outputs.run == 'true'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-check-finish.yml@latest
    with:
      check_run_id: ${{ needs.start.outputs.check_run_id }}
      comment_id: ${{ needs.start.outputs.comment_id }}
      result: ${{ needs.test.result }}
